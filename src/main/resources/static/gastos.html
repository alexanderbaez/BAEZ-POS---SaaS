<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaezPOS - Gastos de Caja</title>

    <!-- Framework UI, Iconos y Librerías -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
          --sidebar-width: 250px;
          --primary-color: #1e3a8a;
          --primary-blue: #0d6efd;
        }
        body {
          background-color: #f8fafc;
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          overflow-x: hidden;
        }

        #content {
          margin-left: var(--sidebar-width);
          width: calc(100% - var(--sidebar-width));
          transition: all 0.3s ease;
          min-height: 100vh;
        }

        .card { border-radius: 15px; border: none; }
        .table thead th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; }

        @media (max-width: 768px) {
            #content { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

<!-- Sidebar Dinámico -->
<div id="sidebar-container"></div>

<!-- Contenedor Principal -->
<div id="content">
    <!-- Navbar con Información de Usuario / Tenant -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom p-3">
        <div class="container-fluid">
            <button type="button" id="sidebarCollapse" class="btn btn-outline-primary d-md-none me-2">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto d-flex align-items-center">
                <div class="text-end me-3">
                    <div id="userName" class="fw-bold text-dark text-capitalize">Usuario</div>
                    <small id="userRoleBadge" class="badge bg-secondary text-uppercase" style="font-size: 0.65rem;">Cargando...</small>
                </div>
                <i class="bi bi-person-circle fs-3 text-primary"></i>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-4">
        <!-- Encabezado de la Sección -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-7">
                <h2 class="fw-bold text-dark mb-0"><i class="bi bi-wallet2 text-danger me-2"></i>Registro de Gastos</h2>
                <p class="text-muted small mb-0">Anotá cualquier salida de dinero de la caja diaria (proveedores, servicios, fletes, etc.).</p>
            </div>
            <div class="col-md-5 text-end mt-3 mt-md-0">
                <button class="btn btn-danger shadow-sm px-4 fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoGasto">
                    <i class="bi bi-plus-lg me-1"></i> REGISTRAR NUEVO GASTO
                </button>
            </div>
        </div>

        <!-- TARJETA DE RESUMEN -->
        <div class="row mb-4">
            <div class="col-12 col-md-4">
                <div class="card shadow-sm p-3 border-start border-danger border-4">
                    <div class="text-muted small fw-bold">TOTAL GASTADO REGISTRADO</div>
                    <div class="fs-3 fw-bold text-danger" id="txtTotalGastos">$0,00</div>
                </div>
            </div>
        </div>

        <!-- TABLA DE GASTOS -->
        <div class="card shadow-sm p-3">
            <div class="table-responsive" style="min-height: 400px;">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="ps-4">FECHA</th>
                        <th>DESCRIPCIÓN</th>
                        <th>CATEGORÍA</th>
                        <th class="text-end">MONTO</th>
                        <th class="text-center pe-4">ACCIONES</th>
                    </tr>
                    </thead>
                    <tbody id="listaGastos" style="font-size: 14px;">
                    <tr><td colspan="5" class="text-center p-4 text-muted">Cargando gastos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO GASTO -->
    <div class="modal fade" id="modalNuevoGasto" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header bg-danger text-white p-3">
                    <h5 class="modal-title fw-bold">Nuevo Gasto de Caja</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="formGasto">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Descripción del gasto *</label>
                            <input type="text" id="descGasto" class="form-control form-control-lg bg-light border-0" placeholder="Ej: Pago de flete, Factura de Luz..." required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold text-muted">Monto ($) *</label>
                                <input type="number" id="montoGasto" class="form-control form-control-lg bg-light border-0 fw-bold text-danger" step="0.01" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold text-muted">Categoría</label>
                                <select id="catGasto" class="form-select form-select-lg bg-light border-0">
                                    <option value="GENERAL">General</option>
                                    <option value="PROVEEDOR">Pago a Proveedor</option>
                                    <option value="SERVICIOS">Servicios (Luz, Agua)</option>
                                    <option value="SUELDOS">Sueldos / Adelantos</option>
                                    <option value="MANTENIMIENTO">Mantenimiento</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-0 p-3">
                        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger px-4 fw-bold">GUARDAR GASTO</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="sidebar.js"></script>
<script src="auth.js"></script>
<script src="gastos.js"></script>
</body>
</html>
