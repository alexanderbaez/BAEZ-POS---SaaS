<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaezPOS | Acceso al Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/saas-ui-core.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="login-page">

<div class="login-card">
  <div class="card-header-custom">
    <h1 class="logo-text">BaezPOS</h1>
    <p class="text-muted small text-uppercase" style="letter-spacing: 1px;">Gestión de Comercio</p>
  </div>

  <div class="card-body p-4 pt-0">
    <div id="messageContainer"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label text-uppercase small fw-bold text-muted">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="admin@correo.com" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-uppercase small fw-bold text-muted">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-login w-100 shadow-sm" id="btnIngresar">
        <span id="btnText">Ingresar al Sistema</span>
        <div class="spinner-border spinner-border-sm d-none" id="loader" role="status"></div>
      </button>

      <div class="text-center mt-3">
        <a href="#" class="text-decoration-none small text-muted fw-bold" onclick="abrirModalRecuperacion()">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>

  <div class="bg-light p-3 text-center border-top">
    <span class="text-muted small">Powered by <strong>Alexander Baez</strong> &copy; 2026</span>
  </div>
</div>

<!-- MODAL DE RECUPERACIÓN DE CONTRASEÑA VIA EMAIL -->
<div class="modal fade" id="modalRecuperacion" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header border-0 pb-0 bg-primary text-white p-4">
        <div>
          <h5 class="modal-title fw-bold text-white mb-1"><i class="bi bi-envelope-at me-2"></i>Recuperar Contraseña</h5>
          <p class="text-white-50 mb-0 small">Solo disponible para administradores</p>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div id="msgRecuperacion"></div>
        <p class="text-muted small mb-4">
          <i class="bi bi-info-circle me-1 text-primary"></i>
          Ingresá tu email de administrador. Recibirás una contraseña temporal para acceder al sistema.
        </p>
        <div class="mb-3">
          <label class="form-label text-uppercase small fw-bold text-muted">Email de Administrador</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="emailRecuperacion" placeholder="admin@correo.com" required>
          </div>
        </div>
      </div>
      <div class="modal-footer bg-light border-0 p-3 d-flex flex-column-reverse flex-md-row gap-2 justify-content-md-end">
        <button type="button" class="btn btn-light px-4 w-100 w-md-auto" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 fw-bold w-100 w-md-auto" id="btnEnviarRecuperacion" onclick="solicitarRecuperacion()">
          <span id="btnRecuperarText"><i class="bi bi-send me-1"></i>Enviar Contraseña</span>
          <div class="spinner-border spinner-border-sm d-none" id="loaderRecuperar" role="status"></div>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
