<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaezPOS - Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --sidebar-width: 250px; --primary-color: #1e3a8a; --primary-blue: #0d6efd; }
        body { background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }

        /* Contenedor alineado con el sidebar dinámico */
        #content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            transition: all 0.3s;
            width: calc(100% - var(--sidebar-width));
        }

        .card-pos { height: calc(100vh - 100px); border: none; border-radius: 15px; }
        .total-display { font-size: 3.5rem; font-weight: 900; color: var(--primary-color); line-height: 1; }
        .table-responsive { height: calc(100vh - 240px); overflow-y: auto; }

        .metodo-pago { cursor: pointer; border: 2px solid #e2e8f0; border-radius: 10px; transition: 0.2s; padding: 10px; text-align: center; }
        .metodo-pago.active { border-color: var(--primary-blue); background: #eff6ff; color: var(--primary-blue); font-weight: bold; }
        .metodo-pago i { font-size: 1.5rem; }

        .sugerencias-box { z-index: 1050; display: none; max-height: 250px; overflow-y: auto; border-radius: 10px; }

        .pulse-icon { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        #alertaSuscripcion .alert { border-radius: 0; border-bottom: 2px solid #f59e0b; }

        .nav-link.active-page { background-color: var(--primary-blue) !important; font-weight: bold; color: white !important; }

        /* AJUSTES RESPONSIVE PARA DISPOSITIVOS MÓVILES Y TABLETS */
        @media (max-width: 768px) {
            #sidebar { left: calc(var(--sidebar-width) * -1) !important; }
            #content { margin-left: 0; width: 100%; }

            .card-pos { height: auto !important; min-height: initial; }
            .table-responsive { height: auto; max-height: 300px; }
            .total-display { font-size: 2.5rem; }

            .metodo-pago { padding: 8px 4px; }
            .metodo-pago i { font-size: 1.25rem; }
            .metodo-pago small { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<!-- Sidebar Dinámico -->
<div id="sidebar-container"></div>

<!-- Contenedor Principal -->
<div id="content">
    <!-- Navbar Superior con Botón Menú Responsivo -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom p-3">
        <div class="container-fluid p-0">
            <button type="button" id="sidebarCollapse" class="btn btn-outline-primary d-md-none me-2">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto d-flex align-items-center">
                <div class="text-end me-2 me-md-3">
                    <div id="userName" class="fw-bold text-dark text-capitalize fs-6">Usuario</div>
                    <small id="userRoleBadge" class="badge bg-secondary text-uppercase" style="font-size: 0.65rem;">Cargando...</small>
                </div>
                <i class="bi bi-person-circle fs-3 text-primary"></i>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-2 p-md-4">
        <div class="row g-3 g-md-4">
            <!-- PANEL IZQUIERDO: BÚSQUEDA Y CARRITO -->
            <div class="col-12 col-md-7 col-lg-8">
                <div class="card card-pos shadow-sm p-3">
                    <!-- Buscador Principal -->
                    <div class="mb-3 position-relative">
                        <div class="input-group input-group-lg shadow-sm">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-upc-scan text-primary"></i></span>
                            <input type="text" id="buscadorVenta" class="form-control border-start-0 fs-6 fs-md-5" placeholder="Escanea o escribe para buscar..." autofocus autocomplete="off">
                        </div>
                        <div id="listaSugerencias" class="list-group position-absolute w-100 shadow-lg sugerencias-box"></div>
                    </div>

                    <!-- Grilla del Carrito de Ventas -->
                    <div class="table-responsive">
                        <table class="table align-middle table-hover mb-0">
                            <thead class="text-muted small border-bottom sticky-top bg-white">
                            <tr>
                                <th>PRODUCTO</th>
                                <th class="text-center">CANT.</th>
                                <th class="text-end">PRECIO</th>
                                <th class="text-end">SUBTOTAL</th>
                                <th class="text-end"></th>
                            </tr>
                            </thead>
                            <tbody id="carritoBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- PANEL DERECHO: TOTALES Y COBRO -->
            <div class="col-12 col-md-5 col-lg-4">
                <div class="card card-pos shadow-sm p-3 p-md-4 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-baseline mb-1">
                            <h6 class="text-muted text-uppercase fw-bold small m-0">Total Final</h6>
                            <button class="btn btn-sm btn-link text-danger d-md-none p-0 text-decoration-none" onclick="cancelarVenta()">Vaciar</button>
                        </div>
                        <div class="total-display mb-3 text-break" id="totalVenta">$0.00</div>

                        <div class="bg-light p-2 rounded-3 border mb-3">
                            <label class="small fw-bold text-muted text-uppercase mb-1 d-block" style="font-size: 0.7rem;">Aplicar Descuento</label>
                            <div class="row g-1">
                                <div class="col-7">
                                    <input type="number" inputmode="decimal" pattern="[0-9]*" id="inputDescuento" class="form-control form-control-sm fw-bold" placeholder="Monto o %" oninput="renderizarCarrito()">
                                </div>
                                <div class="col-5">
                                    <select id="tipoDescuento" class="form-select form-select-sm" onchange="renderizarCarrito()">
                                        <option value="PESOS">$ Pesos</option>
                                        <option value="PORCENTAJE">% Porc.</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <label class="small fw-bold mb-2 text-muted text-uppercase">Método de Pago</label>
                        <div class="row g-2 mb-3">
                            <div class="col-4">
                                <div id="btnEfectivo" class="metodo-pago active" onclick="setMetodo('EFECTIVO', this)">
                                    <i class="bi bi-cash d-block"></i><small>Efectivo</small>
                                </div>
                            </div>
                            <div class="col-4">
                                <div id="btnTransf" class="metodo-pago" onclick="setMetodo('TRANSFERENCIA', this)">
                                    <i class="bi bi-phone d-block"></i><small>Transf/QR</small>
                                </div>
                            </div>
                            <div class="col-4">
                                <div id="btnFiado" class="metodo-pago" onclick="setMetodo('CUENTA_CORRIENTE', this)">
                                    <i class="bi bi-journal-bookmark d-block"></i><small>Libreta</small>
                                </div>
                            </div>
                        </div>

                        <div id="seccionClienteFiado" class="mb-3 d-none">
                            <div class="bg-warning bg-opacity-10 p-3 rounded-3 border border-warning shadow-sm">
                                <label class="small fw-bold text-warning text-uppercase mb-2 text-center d-block">Seleccionar Cliente</label>
                                <div class="position-relative">
                                    <input type="text" id="buscarClientePos" class="form-control form-control-sm border-warning" placeholder="Nombre del cliente...">
                                    <div id="sugerenciasClientes" class="list-group position-absolute w-100 shadow-lg sugerencias-box"></div>
                                </div>
                                <div id="infoClienteSeleccionado" class="mt-2 d-none">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="badge bg-warning text-dark px-2 py-2" id="nombreClientePos"></span>
                                        <span class="small fw-bold">Debe: <span id="saldoClientePos" class="text-danger"></span></span>
                                    </div>
                                    <input type="hidden" id="idClienteSeleccionado">
                                </div>
                            </div>
                        </div>

                        <div id="seccionVuelto" class="bg-light p-3 rounded-3 border mb-3 shadow-sm">
                            <div class="mb-2">
                                <label class="small fw-bold text-muted text-uppercase">Paga con:</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted">$</span>
                                    <input type="number" inputmode="decimal" pattern="[0-9]*" id="pagaCon" class="form-control form-control-lg fw-bold border-start-0" placeholder="0.00">
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <span class="fw-bold text-muted small">VUELTO:</span>
                                <span class="h3 mb-0 fw-bold text-success" id="vueltoVenta">$0.00</span>
                            </div>
                            <button type="button" class="btn btn-outline-secondary btn-sm w-100 mt-3" onclick="reimprimirUltimoTicket()">
                                <i class="bi bi-printer me-1"></i> Reimprimir Último Ticket
                            </button>
                        </div>
                    </div>

                    <div class="mt-2">
                        <button id="btnFinalizarVenta" class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow-sm" onclick="finalizarVenta()">
                            <i class="bi bi-check2-all me-2"></i>CONFIRMAR VENTA
                        </button>
                        <button class="btn btn-outline-danger w-100 mt-2 border-0 d-none d-md-block" onclick="cancelarVenta()">
                            Cancelar Venta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 CSS y JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="sidebar.js"></script>
<script src="auth.js"></script>
<script src="ventas.js?v=2026"></script>
</body>
</html>
