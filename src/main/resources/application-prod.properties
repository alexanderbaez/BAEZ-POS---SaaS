# ==========================================
# PERFIL DE PRODUCCIÓN (application-prod.properties)
# ==========================================

# ==========================================
# BASE DE DATOS & HIKARICP POOL EXTREMO
# ==========================================
# Desactivamos el leak detection agresivo para evitar falsos positivos en cloud/startup
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:0}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.keepalive-time=30000

# ==========================================
# HIBERNATE / JPA OPTIMIZADO PARA STARTUP MÁS RÁPIDO
# ==========================================
# JAMAAS usar "update" en prod, es lentisimo y peligroso
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Cache de queries y planificador
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Batching avanzado
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false

# ==========================================
# LOGGING EN PRODUCCION (Rendimiento)
# ==========================================
logging.level.root=WARN
logging.level.com.baez.baezpos=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.com.zaxxer.hikari=WARN
