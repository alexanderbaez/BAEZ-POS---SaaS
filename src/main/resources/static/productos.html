<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/logo.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaezPOS - Productos</title>
    <!-- Framework UI, Iconos y Librerías -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/saas-ui-core.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<!-- Sidebar Dinámico -->
<div id="sidebar-container"></div>

<!-- Contenido Principal -->
<div id="content">
    <!-- Navbar / User info -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom p-3">
        <div class="container-fluid p-0">
            <button type="button" id="sidebarCollapse" class="btn btn-outline-primary d-md-none me-2">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto d-flex align-items-center">
                <div class="text-end me-2 me-md-3">
                    <div id="userName" class="fw-bold text-dark text-capitalize fs-6">Usuario</div>
                    <small id="userRoleBadge" class="badge bg-secondary text-uppercase" style="font-size: 0.65rem;">Cargando...</small>
                </div>
                <i class="bi bi-person-circle fs-3 text-primary"></i>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-2 p-md-4">
        <!-- Barra superior de acciones y filtros -->
        <div class="row g-2 g-md-3 mb-3 mb-md-4 align-items-center">
            <div class="col-12 col-md-3">
                <h2 class="fw-bold m-0 text-dark fs-3 fs-md-2">Productos</h2>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="buscador" class="form-control border-start-0" placeholder="Buscar por nombre o código..." onkeyup="filtrarProductos()">
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-2">
                <div class="input-group shadow-sm">
                    <select id="filtroCategoria" class="form-select" onchange="filtrarProductos()">
                        <option value="">Todas las categorías</option>
                    </select>
                    <button class="btn btn-outline-secondary" type="button" title="Gestionar Categorías" onclick="abrirModalCategoria()">
                        <i class="bi bi-tags"></i>
                    </button>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <button class="btn btn-outline-secondary shadow-sm w-100" onclick="abrirPapelera()">
                    <i class="bi bi-trash3 me-1 me-md-2"></i>Papelera
                </button>
            </div>
            <div class="col-6 col-md-2">
                <button class="btn btn-primary shadow-sm w-100 fw-bold" onclick="prepararFormulario()">
                    <i class="bi bi-plus-lg me-1 me-md-2"></i>Nuevo
                </button>
            </div>
        </div>

        <!-- Tabla de Productos -->
        <div class="card table-card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                        <tr>
                            <th class="ps-3">Detalle</th>
                            <th class="d-none d-md-table-cell">Categoría</th>
                            <th class="d-none d-lg-table-cell">Costo</th>
                            <th>Precio</th>
                            <th class="d-none d-lg-table-cell">Margen</th>
                            <th>Stock</th>
                            <th class="text-end pe-3">Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="listaProductos">
                        <tr><td colspan="7" class="text-center p-5 text-muted">Cargando inventario...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- Pie de Card con Paginación Controlada -->
            <div class="card-footer bg-white border-0 py-3 px-4 d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                <span class="text-muted small" id="infoPaginacion">Mostrando 0 productos</span>
                <nav aria-label="Navegación de productos">
                    <ul class="pagination pagination-sm m-0" id="paginacionContenedor">
                        <!-- Botones dinámicos -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- MODAL PRODUCTO -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-3 p-md-4">
                    <form id="formProducto">
                        <input type="hidden" id="prodId">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre del Producto *</label>
                            <input type="text" id="prodNombre" class="form-control" required placeholder="Ej: Coca Cola 2.25L">
                        </div>

                        <!-- DESCRIPCIÓN INTEGRADA -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Descripción / Notas (Opcional)</label>
                            <textarea id="prodDescripcion" class="form-control" rows="2" placeholder="Ej: Presentación en botella retornable, pack por 6..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label small fw-bold">Código de Barras</label>
                                <div class="input-group">
                                    <input type="text" id="prodBarcode" class="form-control" placeholder="EAN / Autogenerado">
                                    <button class="btn btn-outline-secondary" type="button" title="Generar código interno" onclick="autogenerarCodigoInput()">
                                        <i class="bi bi-magic"></i>
                                    </button>
                                </div>
                                <div class="form-text text-muted" style="font-size: 0.7rem;">Vacío = Autogenerado al guardar.</div>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label small fw-bold">Categoría</label>
                                <div class="input-group">
                                    <select id="prodCategoria" class="form-select" required></select>
                                    <button class="btn btn-outline-primary" type="button" onclick="abrirModalCategoria()">+</button>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label small fw-bold">Costo ($)</label>
                                <input type="number" inputmode="decimal" step="0.01" id="prodCosto" class="form-control amount-num" required placeholder="0.00">
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label small fw-bold">Precio Venta ($)</label>
                                <input type="number" inputmode="decimal" step="0.01" id="prodPrecio" class="form-control amount-num fw-bold text-primary" required placeholder="0.00">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label small fw-bold">Stock Actual</label>
                                <input type="number" inputmode="decimal" step="any" id="prodStock" class="form-control amount-num" value="0">
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label small fw-bold">Stock Mínimo</label>
                                <input type="number" inputmode="decimal" step="any" id="prodMinStock" class="form-control amount-num" value="5">
                            </div>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="prodIsFractional">
                            <label class="form-check-label small fw-bold text-dark" for="prodIsFractional">
                                ⚖️ Producto Pesable / Venta por Fracción (Kg/Granel)
                            </label>
                        </div>
                        <div class="d-flex flex-column-reverse flex-md-row gap-2 justify-content-md-end mt-3">
                            <button type="button" class="btn btn-light px-4 w-100 w-md-auto" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary px-4 fw-bold w-100 w-md-auto d-flex align-items-center justify-content-center gap-2">
                                <span>Guardar Producto</span>
                                <kbd class="bg-white bg-opacity-25 text-white border-0 px-2 py-0.5 rounded font-monospace small" style="font-size: 0.75rem;">Enter ↵</kbd>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PAPELERA -->
    <div class="modal fade" id="modalPapelera" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-secondary text-white">
                    <h5 class="modal-title fw-bold">Papelera de Reciclaje</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                            <tr>
                                <th class="ps-3">Producto</th>
                                <th class="text-end pe-3">Acción</th>
                            </tr>
                            </thead>
                            <tbody id="listaBorrados"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL GESTIÓN DE CATEGORÍAS (CRUD COMPLETO) -->
    <div class="modal fade" id="modalCategorias" tabindex="-1" aria-labelledby="modalCategoriasLabel" aria-hidden="true" style="z-index: 1060;">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark" id="modalCategoriasLabel">
                        <i class="bi bi-tags text-primary me-2"></i>Gestión de Categorías
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body p-3 p-md-4">
                    <!-- Formulario dedicado en la parte superior -->
                    <div class="bg-light p-3 rounded-3 border mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="small fw-bold text-uppercase text-secondary" id="formCatTitulo">Nueva Categoría</span>
                            <button type="button" class="btn btn-sm btn-link text-decoration-none text-muted p-0 d-none" id="btnCancelarEdicionCat" onclick="cancelarEdicionCategoria()">
                                <i class="bi bi-x-circle me-1"></i>Cancelar Edición
                            </button>
                        </div>
                        <form id="formCategoria" onsubmit="event.preventDefault(); guardarCategoria();">
                            <input type="hidden" id="editCatId" value="">
                            
                            <!-- Input Nombre con form-floating -->
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="catNombre" placeholder=" " maxlength="120" required autocomplete="off">
                                <label for="catNombre">Nombre de la Categoría *</label>
                            </div>

                            <!-- Input Descripción con form-floating -->
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="catDescripcion" placeholder=" " maxlength="255" autocomplete="off">
                                <label for="catDescripcion">Descripción (Opcional)</label>
                            </div>

                            <!-- Estado Activo -->
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="catEstadoActivo" checked>
                                <label class="form-check-label small fw-semibold text-secondary" for="catEstadoActivo">Categoría Activa</label>
                            </div>

                            <!-- Botón de acción dinámico -->
                            <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm d-flex align-items-center justify-content-center" id="btnGuardarCat">
                                <i class="bi bi-plus-circle me-2" id="iconBtnCat"></i>
                                <span id="textoBtnCat">Crear Categoría</span>
                            </button>
                        </form>
                    </div>

                    <!-- Encabezado de Lista -->
                    <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                        <span class="small fw-bold text-uppercase text-secondary">Categorías Existentes</span>
                        <span class="badge bg-secondary-subtle text-secondary rounded-pill" id="badgeTotalCategorias">0</span>
                    </div>

                    <!-- Lista con Bloqueo de Altura -->
                    <div class="border rounded-3" style="max-height: 350px; overflow-y: auto;">
                        <ul class="list-group list-group-flush" id="listaCategoriasModal">
                            <!-- Items inyectados dinámicamente -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="sidebar.js"></script>
<script src="auth.js"></script>
<script src="productos.js"></script>
</body>
</html>
