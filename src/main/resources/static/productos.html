<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaezPOS - Productos</title>
    <!-- Framework UI, Iconos y Librerías -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        :root { --sidebar-width: 250px; --primary-blue: #0d6efd; }
        body { background-color: #f8fafc; overflow-x: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        #content {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            transition: all 0.3s ease;
            min-height: 100vh;
        }

        .product-name { font-weight: 600; margin-bottom: 0; color: #1e293b; }
        .product-code { font-size: 0.75rem; color: #64748b; }

        @media (max-width: 768px) {
            #content { margin-left: 0; width: 100%; }
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<!-- Sidebar Dinámico -->
<div id="sidebar-container"></div>

<!-- Contenido Principal -->
<div id="content">
    <!-- Navbar / User info -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom p-3">
        <div class="container-fluid">
            <button type="button" id="sidebarCollapse" class="btn btn-outline-primary d-md-none me-2">
                <i class="bi bi-list"></i>
            </button>
            <div class="ms-auto d-flex align-items-center">
                <div class="text-end me-3">
                    <div id="userName" class="fw-bold text-dark text-capitalize">Usuario</div>
                    <small id="userRoleBadge" class="badge bg-secondary text-uppercase" style="font-size: 0.65rem;">Cargando...</small>
                </div>
                <i class="bi bi-person-circle fs-3 text-primary"></i>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-4">
        <!-- Barra superior de acciones y filtros -->
        <div class="row g-3 mb-4 align-items-center">
            <div class="col-12 col-md-3">
                <h2 class="fw-bold m-0 text-dark">Productos</h2>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="buscador" class="form-control border-start-0" placeholder="Buscar por nombre o código..." onkeyup="filtrarProductos()">
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-2">
                <select id="filtroCategoria" class="form-select shadow-sm" onchange="filtrarProductos()">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <button class="btn btn-outline-secondary shadow-sm w-100" onclick="abrirPapelera()">
                    <i class="bi bi-trash3 me-2"></i>Papelera
                </button>
            </div>
            <div class="col-6 col-md-2">
                <button class="btn btn-primary shadow-sm w-100 fw-bold" onclick="prepararFormulario()">
                    <i class="bi bi-plus-lg me-2"></i>Nuevo
                </button>
            </div>
        </div>

        <!-- Tabla de Productos -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Detalle</th>
                            <th>Categoría</th>
                            <th>Costo</th>
                            <th>Precio Venta</th>
                            <th>Margen</th>
                            <th>Stock</th>
                            <th class="text-end pe-4">Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="listaProductos">
                        <tr><td colspan="7" class="text-center p-5 text-muted">Cargando inventario...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PRODUCTO -->
    <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formProducto">
                        <input type="hidden" id="prodId">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre del Producto</label>
                            <input type="text" id="prodNombre" class="form-control" required placeholder="Ej: Coca Cola 2.25L">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">Código de Barras</label>
                                <input type="text" id="prodBarcode" class="form-control" placeholder="EAN / Interno">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">Categoría</label>
                                <div class="input-group">
                                    <select id="prodCategoria" class="form-select" required></select>
                                    <button class="btn btn-outline-primary" type="button" onclick="abrirModalCategoria()">+</button>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">Costo ($)</label>
                                <input type="number" step="0.01" id="prodCosto" class="form-control" required placeholder="0.00">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">Precio Venta ($)</label>
                                <input type="number" step="0.01" id="prodPrecio" class="form-control" required placeholder="0.00">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">Stock Actual</label>
                                <input type="number" id="prodStock" class="form-control" value="0">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">Stock Mínimo</label>
                                <input type="number" id="prodMinStock" class="form-control" value="5">
                            </div>
                        </div>
                        <div class="text-end mt-3">
                            <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary px-4 fw-bold">Guardar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PAPELERA -->
    <div class="modal fade" id="modalPapelera" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-secondary text-white">
                    <h5 class="modal-title fw-bold">Papelera de Reciclaje</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                        <tr>
                            <th class="ps-3">Producto</th>
                            <th class="text-end pe-3">Acción</th>
                        </tr>
                        </thead>
                        <tbody id="listaBorrados"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="sidebar.js"></script>
<script src="auth.js"></script>
<script src="productos.js"></script>
</body>
</html>
