# ==========================================
# APLICACION
# ==========================================
spring.application.name=baezpos

# ==========================================
# BASE DE DATOS (MySQL) & HIKARICP POOL
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:baezpos_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.pool-name=BaezPosHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:120000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:300000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:5000}

# ==========================================
# JPA / HIBERNATE & BATCH PROCESSING
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=512
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.locale=es_AR

# ==========================================
# RED, COMPRESIÓN HTTP & CACHÉ ESTÁTICA
# ==========================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html,text/plain,application/xml
server.compression.min-response-size=1024

spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.cache=true
spring.web.resources.chain.compressed=true

# ==========================================
# SERVICIO DE CORREO TRANSACCIONAL (Resend HTTP API)
# ==========================================
resend.api.key=${RESEND_API_KEY:}
app.mail.from=${APP_MAIL_FROM:BÁEZ POS <onboarding@resend.dev>}

# ==========================================
# CREDENCIALES MAESTRAS (SuperAdmin SaaS)
# ==========================================
app.superadmin.email=${SUPERADMIN_EMAIL:alexanderbaez146@gmail.com}
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# ==========================================
# CONFIGURACION CORS
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://master.d3gp9of2938ba5.amplifyapp.com,http://localhost:3000,http://localhost:8080}

# ==========================================
# SEGURIDAD JWT
# ==========================================
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# LOGS (Optimizado para Producción / Render Free Tier)
# ==========================================
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.baez.baezpos=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_HIBERNATE_BIND:WARN}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:WARN}
logging.level.com.zaxxer.hikari=${LOG_LEVEL_HIKARI:WARN}