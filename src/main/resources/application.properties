# ==========================================
# APLICACION
# ==========================================
spring.application.name=baezpos

# Configuración de Proxy Inverso (Indispensable para Nginx Proxy Manager)
server.forward-headers-strategy=native

# ==========================================
# BASE DE DATOS (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:baezpos_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jackson.serialization.fail-on-empty-beans=false

# ==========================================
# SERVICIO DE CORREO (SMTP SSL - Puerto 465)
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:alexanderbaez146@gmail.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# ==========================================
# CREDENCIALES MAESTRAS (SuperAdmin SaaS)
# ==========================================
app.superadmin.email=${SUPERADMIN_EMAIL:alexanderbaez146@gmail.com}
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# ==========================================
# CONFIGURACION CORS
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://baezpos.com,https://www.baezpos.com,https://master.d3gp9of2938ba5.amplifyapp.com,http://localhost:3000,http://localhost:8080}

# ==========================================
# LOGS Y THYMELEAF
# ==========================================
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}