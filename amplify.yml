version: 1
frontend:
  phases:
    build:
      commands: []
  artifacts:
    baseDirectory: src/main/resources/static
    files:
      - '**/*'
  cache:
    paths: []
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'no-store, no-cache, must-revalidate'
  redirects:
    - source: '/'
      target: '/login.html'
      status: '200'
      condition: null